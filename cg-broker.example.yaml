# cg-broker.yaml — единый конфиг для Mosquitto MQTT broker
# Копируйте этот файл в cg-broker.yaml и редактируйте под свои нужды.

listener:
  bind_ip: "10.10.10.1"
  port: 1883

paths:
  mosquitto_conf: "/etc/mosquitto/conf.d/cg.conf"
  log: "/var/log/mosquitto/mosquitto.log"

persistence:
  enabled: true
  location: "/var/lib/mosquitto/"

logging:
  connection_messages: true

# Опционально на будущее (auth_enabled=false — аутентификация выключена):
security:
  auth_enabled: false
  allow_anonymous: true
  passwd_path: "/etc/mosquitto/passwd"
  acl_path: "/etc/mosquitto/acl"
  users: []
